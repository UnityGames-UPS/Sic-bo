<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>ML_SB</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: black;
    }

    #unity-canvas {
      height: 100%;
      width: 100%;
    }

      #loading-screen {
      position: absolute;
      width: 100%;
      height: 100%;
  }




  </style>
</head>

<body>

  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script>
    const canvas=document.querySelector("#unity-canvas");

    function resizeCanvas() {
      const aspectRatio = 16 / 9; // Aspect ratio of the canvas
      let windowWidth = window.innerWidth;
      let windowHeight = window.innerHeight;

      if (windowWidth < windowHeight) {
        let canvasWidth = windowWidth;
        let canvasHeight = canvasWidth / aspectRatio;

        if (canvasHeight > windowHeight) {
          canvasHeight = windowHeight;
          canvasWidth = canvasHeight * aspectRatio;
        }

        canvas.style.width = `${canvasWidth}px`;
        canvas.style.height = `${canvasHeight}px`;

      } else {

        canvas.style.width = '100%';
        canvas.style.height = '100%';
      }
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(resizeCanvas, 50);
    });

    var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Build.loader.js";
      var config = {
        dataUrl: buildUrl + "/Build.data.unityweb",
        frameworkUrl: buildUrl + "/Build.framework.js.unityweb",
        codeUrl: buildUrl + "/Build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ML_SB",
        productVersion: "1.0",
      };

        // ✅ FIX: Initialize window.unityInstance EARLY so JavaScript listeners can access it
        window.unityInstance = null;
        
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
          }).then((unityInstance) => {
            // ✅ FIX: Assign the real Unity instance once it's ready
            window.unityInstance = unityInstance;
            console.log('[Unity] Instance ready and stored globally');
            console.log('[Unity] window.unityInstance type:', typeof window.unityInstance);
            console.log('[Unity] SendMessage available:', typeof window.unityInstance.SendMessage === 'function');
            
            // ✅ FIX: Trigger any pending fullscreen callbacks now that Unity is ready
            if (window._unityFullscreenCallback && typeof window._pendingFullscreenCheck === 'boolean') {
              console.log('[Unity] Running pending fullscreen check...');
              window._unityFullscreenCallback();
              delete window._pendingFullscreenCheck;
            }
          }).catch((message) => {
            alert(message);
          });
        };
        
        document.body.appendChild(script);
        window.addEventListener('load', resizeCanvas());
  </script>
     <script type="text/javascript">
        console.log = function() {};
        console.warn = function() {};
        console.error = function() {};
    </script>
    <script>
      window.focus();
    </script>

</body>

</html>
